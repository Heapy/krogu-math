name: Compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.ref }}
  # Let the active platform matrix finish; queue the newest revision behind it.
  cancel-in-progress: false
jobs:
  build-plugin-sources:
    name: Restore locked downloaded build plugins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Restore and verify the locked source plugin
        uses: Heapy/setup-ktc-plugins@5de74f161cb07ad74e72ee28bfad228f4cce3bb4 # v1.0.0
      - name: Record locked plugin source inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ktc-plugin-input
          printf '%s\n' "$GITHUB_SHA" > build/ktc-plugin-input/SOURCE_COMMIT
          find plugins/benchmark -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > build/ktc-plugin-input/SHA256SUMS
          sha256sum ktc-plugins.yaml ktc-plugins.lock.yaml >> build/ktc-plugin-input/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: locked-build-plugins-${{ github.sha }}
          path: |
            plugins/benchmark/
            build/ktc-plugin-input/
          include-hidden-files: true
          if-no-files-found: error
  oracle:
    runs-on: ubuntu-24.04
    env:
      JAVA_TOOL_OPTIONS: -XX:-OmitStackTraceInFastThrow
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Heapy/setup-main-kts@b0858237748f325b825e752bbac2ec2eb1fb9419 # v1.0.1
        with:
          kotlin-version: '2.4.21'
          java-version: '25.0.4+9'
          distribution: 'liberica'
      - run: kotlinr scripts/generate-oracle.main.kts --check
      - run: kotlinr scripts/generate-scale-oracle.main.kts --check
      - run: kotlinr scripts/generate-null-oracle.main.kts --check
      - run: kotlinr scripts/generate-character-oracle.main.kts --check
      - run: kotlinr scripts/generate-prime-oracle.main.kts --check
      - run: kotlinr scripts/generate-prime-prefix-oracle.main.kts --check
      - run: kotlinr scripts/generate-decimal-pair-dispatch-oracle.main.kts --check
      - run: kotlinr scripts/generate-decimal-integral-dispatch-oracle.main.kts --check
      - run: kotlinr scripts/generate-decimal-context-dispatch-oracle.main.kts --check
      - name: Verify context-dispatch field classification
        run: kotlinr -J-Xmx512m scripts/map-decimal-context-contract-coverage.main.kts --check
        env:
          JAVA_OPTS: -Xmx512m
      - run: kotlinr scripts/extract-decimal-context-returned-representations.main.kts --check
      - run: kotlinr scripts/inventory-decimal-exact-root-callbacks-563.main.kts
      - run: kotlinr scripts/generate-decimal-remainder-array-oracle.main.kts --check
      - run: kotlinr scripts/generate-integer-arithmetic-oracle.main.kts --check
      - run: kotlinr scripts/generate-integer-parser-oracle.main.kts --check
      - run: kotlinr scripts/generate-integer-bytes-oracle.main.kts --check
      - run: kotlinr scripts/generate-integer-division-oracle.main.kts --check
      - run: kotlinr scripts/generate-integer-pow-oracle.main.kts --check
      - run: kotlinr scripts/generate-integer-gcd-oracle.main.kts --check
      - run: kotlinr scripts/generate-integer-sqrt-oracle.main.kts --check
      - run: kotlinr scripts/generate-integer-bits-oracle.main.kts --check
      - run: kotlinr scripts/generate-integer-inverse-oracle.main.kts --check
      - run: kotlinr scripts/generate-integer-modpow-oracle.main.kts --check
      - run: kotlinr scripts/generate-context-oracle.main.kts --check
      - run: kotlinr scripts/generate-hash-oracle.main.kts --check
  platforms:
    needs: build-plugin-sources
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platforms: jvm linuxX64
          - os: windows-2025
            platforms: jvm mingwX64
          - os: macos-15
            platforms: jvm macosArm64 iosSimulatorArm64
          - os: macos-15-intel
            platforms: jvm macosX64 iosX64
    runs-on: ${{ matrix.os }}
    env:
      KOTLIN_CLI_JAVA_OPTIONS: -Xmx4g -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: liberica
          java-version: '25.0.4+9'
      - uses: Heapy/setup-main-kts@b0858237748f325b825e752bbac2ec2eb1fb9419 # v1.0.1
        with:
          kotlin-version: '2.4.21'
          java-version: '25.0.4+9'
          distribution: liberica
      - name: Configure project-derived Native test friend paths
        shell: bash
        run: kotlinr tools/configure-native-tests.main.kts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: locked-build-plugins-${{ github.sha }}
          path: .
      # The installer has no macOS x64 binary. All hosts verify the same source
      # artifact restored from the checked-in lock, including hidden license files.
      - name: Verify same-run locked plugin sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat build/ktc-plugin-input/SOURCE_COMMIT)" = "$GITHUB_SHA"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check build/ktc-plugin-input/SHA256SUMS
          else
            shasum -a 256 --check build/ktc-plugin-input/SHA256SUMS
          fi
      - uses: Heapy/setup-ktc@cc63216665ce07ce0709fe52ef4a4b0b63aeaddc # v1.1.0
        with:
          version: '0.13.0'
      - name: Execute each host platform selection sequentially
        shell: bash
        run: |
          set -euo pipefail
          # The generated test-only friend paths bind this checkout's default build directory.
          for platform in ${{ matrix.platforms }}; do
            ./kotlin test -m krogu-math --platform "$platform" --variant debug '--include-classes=*' --format teamcity 2>&1 | tee "build/compatibility-$platform.log"
          done
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: matrix.os == 'ubuntu-24.04'
        with:
          node-version: '24.16.0'
      # KTC 0.13 links JS tests but has no built-in JS test runner. Keep the
      # original Node coverage for both web targets using their actual linked tests.
      - name: Execute JS tests on Node
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          kotlinr tools/run-node-tests.main.kts js 2>&1 | tee build/compatibility-js.log
      - name: Execute Wasm tests on Node
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          kotlinr tools/run-node-tests.main.kts wasm 2>&1 | tee build/compatibility-wasmJs.log
      - name: Cross-link Linux ARM64 tests
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: ./kotlin task :krogu-math:linkLinuxArm64TestDebug
      - name: Compile iOS device library (not device runtime)
        if: matrix.os == 'macos-15'
        shell: bash
        run: ./kotlin task :krogu-math:compileIosArm64Debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && !cancelled()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            build/reports/**
            build/node-tests/**
            build/compatibility-*.log
          if-no-files-found: warn
      - name: Bind cross-built ARM64 executable to this checkout
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          binaries=(build/tasks/_krogu-math_linkLinuxArm64TestDebug/*.kexe)
          test "${#binaries[@]}" = 1
          test -f "${binaries[0]}"
          mkdir -p build/linux-arm64-input
          cp "${binaries[0]}" build/linux-arm64-input/test.kexe
          printf '%s\n' "$GITHUB_SHA" > build/linux-arm64-input/SOURCE_COMMIT
          (cd build/linux-arm64-input && sha256sum test.kexe SOURCE_COMMIT > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: linux-arm64-tests
          path: build/linux-arm64-input/
          if-no-files-found: error
      - name: Bind public-test JVM artifact to this checkout
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./kotlin task :krogu-math:jarJvm
          mkdir -p build/public-math-input
          cp build/tasks/_krogu-math_jarJvm/krogu-math-jvm.jar build/public-math-input/krogu-math.jar
          printf '%s\n' "$GITHUB_SHA" > build/public-math-input/SOURCE_COMMIT
          cd build/public-math-input
          sha256sum krogu-math.jar SOURCE_COMMIT > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: public-math-jvm-${{ github.sha }}
          path: build/public-math-input/
          if-no-files-found: error
  public-math:
    name: Public OpenJDK math tests (not official JCK)
    needs: platforms
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Heapy/setup-main-kts@b0858237748f325b825e752bbac2ec2eb1fb9419 # v1.0.1
        with:
          kotlin-version: '2.4.21'
          java-version: '25.0.4+9'
          distribution: 'liberica'
          cache-compiled-scripts: 'false'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-math-jvm-${{ github.sha }}
          path: build/public-math-input
      - name: Verify same-run JVM artifact and source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat build/public-math-input/SOURCE_COMMIT)" = "$GITHUB_SHA"
          cd build/public-math-input
          sha256sum --check SHA256SUMS
      - name: Run retained public baseline and port invocations
        timeout-minutes: 330
        shell: bash
        env:
          JAVA_OPTS: -Xmx256m
          KOTLIN_MAIN_KTS_COMPILED_SCRIPTS_CACHE_DIR: ${{ runner.temp }}/public-math-script-cache
        run: |
          set -euo pipefail
          env -u JAVA_TOOL_OPTIONS -u JDK_JAVA_OPTIONS -u _JAVA_OPTIONS -u KOTLIN_OPTS -u JAVACMD -u CLASSPATH \
            kotlinr -J-Xmx256m tools/run-math-tck.main.kts --both \
            --port-jar "$PWD/build/public-math-input/krogu-math.jar" \
            --profiles standard,serialization,heavy,memory-512m \
            --max-heap-mib 512 --os-memory-gib auto \
            --ci-execution "$GITHUB_RUN_ID:$GITHUB_SHA" \
            --allow-owned-timeout-cleanup 2>&1 | tee build/public-math-campaign.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-math-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/math-tck/
            build/public-math-input/
            build/public-math-campaign.log
            tools/math-tck/
            tools/run-math-tck.main.kts
            docs/public-math-ci-559.md
            !build/math-tck/**/*.jar
            !build/math-tck/**/*.class
          if-no-files-found: warn
          compression-level: 1
  linux-arm64:
    needs: platforms
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-arm64-tests
      - name: Verify same-run binary and execute on ARM64
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
          sha256sum --check SHA256SUMS
          chmod +x test.kexe
          ./test.kexe 2>&1 | tee arm64-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-arm64-test-evidence-${{ github.sha }}
          path: |
            SOURCE_COMMIT
            SHA256SUMS
            arm64-tests.log
          if-no-files-found: warn

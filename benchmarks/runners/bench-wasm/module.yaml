product: wasm-js/app
apply:
  - //common.module-template.yaml
dependencies:
  - //benchmarks/standard
plugins:
  benchmark:
    enabled: true
    platform: wasmJs
    warmups: 5
    iterations: 7
    iterationTime: 1
    iterationTimeUnit: s
    outputTimeUnit: ns
    mode: avgt
    jvmForks: 3
    timeoutSeconds: 21600
